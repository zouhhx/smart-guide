<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>61 数字人控制台</title>
  <style>
    :root { color-scheme: dark; --bg:#081018; --panel:#101b26; --line:#243647; --text:#eef6ff; --muted:#8ca3b8; --cyan:#35d6c1; --blue:#4c8dff; --red:#ff6b7a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:"Microsoft YaHei UI","Segoe UI",sans-serif; color:var(--text); background:radial-gradient(circle at 80% 0,#14344a 0,transparent 32%),linear-gradient(145deg,#071019,#0c151e 58%,#071017); }
    .shell { width:min(1080px,calc(100% - 32px)); margin:0 auto; padding:34px 0 48px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:24px; }
    h1 { margin:0; font-size:30px; letter-spacing:.04em; }
    .subtitle { margin:8px 0 0; color:var(--muted); font-size:14px; }
    .status { display:flex; align-items:center; gap:9px; padding:10px 14px; border:1px solid var(--line); border-radius:999px; background:#0b1620cc; color:var(--muted); }
    .dot { width:9px; height:9px; border-radius:50%; background:#647485; box-shadow:0 0 0 4px #64748522; }
    .status.online { color:#b9fff4; border-color:#25685e; }
    .status.online .dot { background:var(--cyan); box-shadow:0 0 14px var(--cyan); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .card { padding:22px; border:1px solid var(--line); border-radius:18px; background:linear-gradient(145deg,#111e2aee,#0d1721ee); box-shadow:0 18px 55px #0005; }
    .card.wide { grid-column:1/-1; }
    h2 { margin:0 0 18px; font-size:16px; font-weight:650; }
    .actions { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    button { min-height:48px; padding:0 18px; border:1px solid #31506b; border-radius:12px; background:#15283a; color:var(--text); font:inherit; font-weight:650; cursor:pointer; transition:.15s ease; }
    button:hover { transform:translateY(-1px); border-color:#5b91bd; background:#1a334a; }
    button:active { transform:translateY(0); }
    button.primary { border-color:#2d8e82; background:linear-gradient(135deg,#147e72,#17665f); }
    button.danger { border-color:#84414b; background:#48232a; }
    button:disabled { opacity:.45; cursor:not-allowed; transform:none; }
    textarea,input { width:100%; border:1px solid var(--line); border-radius:12px; background:#09131c; color:var(--text); font:inherit; outline:none; }
    textarea:focus,input:focus { border-color:var(--blue); box-shadow:0 0 0 3px #4c8dff24; }
    textarea { min-height:116px; padding:14px; resize:vertical; line-height:1.65; }
    .speak-row { display:grid; grid-template-columns:1fr 140px 120px; gap:12px; margin-top:12px; }
    .fields { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    label { display:block; color:var(--muted); font-size:12px; }
    input { height:44px; margin-top:7px; padding:0 12px; }
    .apply { margin-top:14px; width:100%; }
    .meta { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:18px; }
    .meta div { padding:13px; border-radius:12px; background:#09131c; border:1px solid #1c2d3c; }
    .meta span { display:block; color:var(--muted); font-size:11px; margin-bottom:6px; }
    .meta strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
    .toast { position:fixed; right:22px; bottom:22px; max-width:360px; padding:13px 16px; border:1px solid #2c746a; border-radius:12px; background:#102a28f2; box-shadow:0 16px 48px #0008; opacity:0; transform:translateY(10px); pointer-events:none; transition:.2s; }
    .toast.show { opacity:1; transform:none; }
    .toast.error { border-color:#8c4450; background:#371e24f2; }
    @media (max-width:760px) { .grid{grid-template-columns:1fr}.card.wide{grid-column:auto}.actions,.fields{grid-template-columns:1fr 1fr}.speak-row{grid-template-columns:1fr 1fr}.speak-row textarea{grid-column:1/-1}.meta{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column} }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><h1>数字人控制台</h1><p class="subtitle">61 电脑 · MoFa 客户端控制</p></div>
      <div id="status" class="status"><span class="dot"></span><span id="statusText">正在检查…</span></div>
    </header>
    <section class="grid">
      <article class="card">
        <h2>画面控制</h2>
        <div class="actions">
          <button class="primary" data-action="open">打开数字人</button>
          <button class="danger" data-action="exit">退出数字人</button>
          <button class="primary" data-action="show">显示</button>
          <button data-action="hide">隐藏</button>
          <button data-action="reset">全屏归位</button>
        </div>
        <div class="meta">
          <div><span>连接状态</span><strong id="onlineMeta">--</strong></div>
          <div><span>播报状态</span><strong id="speakingMeta">--</strong></div>
          <div><span>设备 ID</span><strong id="deviceMeta">--</strong></div>
        </div>
      </article>
      <article class="card">
        <h2>窗口位置</h2>
        <div class="fields">
          <label>宽度<input id="width" type="number" value="3840"></label>
          <label>高度<input id="height" type="number" value="2160"></label>
          <label>X 坐标<input id="x" type="number" value="0"></label>
          <label>Y 坐标<input id="y" type="number" value="0"></label>
        </div>
        <button class="apply" data-action="bounds">应用位置和尺寸</button>
      </article>
      <article class="card wide">
        <h2>播报控制</h2>
        <div class="speak-row">
          <textarea id="text" placeholder="输入需要数字人说的话，例如：您好，欢迎来到展厅。"></textarea>
          <button class="primary" data-action="say">开始播报</button>
          <button class="danger" data-action="interrupt">打断</button>
        </div>
      </article>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script>
    const $ = (id) => document.getElementById(id);
    const toast = $('toast');
    let toastTimer;
    function notify(message, error=false) {
      clearTimeout(toastTimer); toast.textContent=message; toast.className='toast show'+(error?' error':'');
      toastTimer=setTimeout(()=>toast.className='toast',2600);
    }
    async function api(path, body) {
      const response = await fetch(path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});
      const data = await response.json();
      if (!response.ok || data.ok===false) throw new Error(data.error||`请求失败 (${response.status})`);
      return data;
    }
    async function refresh() {
      try {
        const s=await api('/health');
        $('status').classList.toggle('online',s.online); $('statusText').textContent=s.online?'数字人在线':'数字人离线';
        $('onlineMeta').textContent=s.online?'已连接':'未连接'; $('speakingMeta').textContent=s.speaking?'正在讲话':'空闲';
        $('deviceMeta').textContent=s.session?.deviceId||'--';
        document.querySelectorAll('button').forEach(b=>b.disabled=!s.online);
      } catch { $('status').classList.remove('online'); $('statusText').textContent='服务异常'; }
    }
    const actions={
      open:()=>api('/api/avatar/open',{}).then(()=>notify('正在打开数字人，请稍候')),
      exit:()=>api('/api/avatar/exit',{}).then(()=>notify('正在退出数字人')),
      show:()=>api('/api/avatar/show',{duration:300}).then(()=>notify('数字人已显示')),
      hide:()=>api('/api/avatar/hide',{duration:300}).then(()=>notify('数字人已隐藏')),
      reset:()=>api('/api/avatar/reset',{}).then(()=>notify('已按 3840×2160 全屏归位')),
      bounds:()=>api('/api/avatar/set-bounds',{width:+$('width').value,height:+$('height').value,x:+$('x').value,y:+$('y').value}).then(()=>notify('窗口位置已应用')),
      say:()=>{const text=$('text').value.trim();if(!text)throw new Error('请先输入播报内容');return api('/api/avatar/say',{text}).then(()=>notify('播报指令已发送'));},
      interrupt:()=>api('/api/avatar/interrupt',{}).then(()=>notify('已发送打断指令'))
    };
    document.addEventListener('click',async(e)=>{const name=e.target.dataset.action;if(!name)return;try{e.target.disabled=true;await actions[name]();}catch(err){notify(err.message,true);}finally{e.target.disabled=false;refresh();}});
    refresh(); setInterval(refresh,3000);
  </script>
</body>
</html>
